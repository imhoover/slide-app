<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロンプトプレビュー</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f7f7fb;
      color: #222;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    pre {
      white-space: pre-wrap;
      background: #f1f3ff;
      padding: 20px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #4a4aff;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      background: #4a4aff;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary {
      background: #e6e9ff;
      color: #2d2d8f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>プロンプトプレビュー</h1>
    <p>下記のプロンプトをそのまま生成AIに渡して台本を作成してください。</p>
    <pre id="script-content">{{ content }}</pre>
    <div class="actions">
      <button type="button" onclick="copyScript()">プロンプトをコピー</button>
      <a href="/">← 入力画面に戻る</a>
    </div>
  </div>
  <script>
    function copyScript() {
      const text = document.getElementById("script-content").textContent;
      navigator.clipboard.writeText(text);
    }
  </script>
</body>
</html>
